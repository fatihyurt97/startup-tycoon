<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Tycoon: Garajdan Silikon Vadisi'ne</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --button-hover: #0ea5e9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            color: var(--accent-color);
        }

        #subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .game-container {
            display: flex;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .panel {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            flex: 1;
            min-width: 280px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
        }

        .stat-box {
            font-size: 1.5rem;
            margin: 15px 0;
            font-weight: bold;
            color: #4ade80;
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--button-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .shop-item button {
            width: auto;
            margin-top: 0;
            padding: 8px 12px;
            font-size: 0.9rem;
        }

        /* İleride PNG koyacağımız görsel alanı */
        #visual-area {
            width: 100%;
            height: 150px;
            background: #0b0f19;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            margin-bottom: 15px;
            border: 2px dashed #334155;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <h1>Startup Tycoon</h1>
        <div id="subtitle">Garajdan Silikon Vadisi'ne Yolculuk</div>
    </header>

    <div class="game-container">
        <!-- Sol Panel: Tıklama ve Kazanım -->
        <div class="panel">
            <h3>Ofis Durumu</h3>
            <!-- İleride buraya kendi PNG görsellerinizi koyacaksınız -->
            <div id="visual-area">
                [ Buraya Garaj / Ofis PNG'si Gelecek ]
            </div>
            
            <div>Kasa (Dolar)</div>
            <div class="stat-box" id="money-display">$0</div>
            
            <button id="click-btn">💻 Kod Yaz (+1 $)</button>
        </div>

        <!-- Sağ Panel: Yükseltmeler ve Otomasyon -->
        <div class="panel">
            <h3>Ekip & Ofis</h3>
            
            <div class="shop-item">
                <div style="text-align: left;">
                    <div id="intern-count">Stajyer: 0</div>
                    <small style="color: #94a3b8;">Maliyet: <span id="intern-cost">15</span>$ | +1$/sn</small>
                </div>
                <button id="buy-intern">Satın Al</button>
            </div>

            <div class="shop-item">
                <div style="text-align: left;">
                    <div id="dev-count">Yazılımcı: 0</div>
                    <small style="color: #94a3b8;">Maliyet: <span id="dev-cost">100</span>$ | +8$/sn</small>
                </div>
                <button id="buy-dev">Satın Al</button>
            </div>
        </div>
    </div>

    <script>
        // Oyun Değişkenleri
        let money = 0;
        let perClick = 1;
        
        let intern = { count: 0, cost: 15, income: 1 };
        let dev = { count: 0, cost: 100, income: 8 };

        // HTML Elementleri
        const moneyDisplay = document.getElementById('money-display');
        const clickBtn = document.getElementById('click-btn');
        
        const buyInternBtn = document.getElementById('buy-intern');
        const internCountDisplay = document.getElementById('intern-count');
        const internCostDisplay = document.getElementById('intern-cost');

        const buyDevBtn = document.getElementById('buy-dev');
        const devCountDisplay = document.getElementById('dev-count');
        const devCostDisplay = document.getElementById('dev-cost');

        // Tıklama Olayı (Kod Yazma)
        clickBtn.addEventListener('click', () => {
            money += perClick;
            updateUI();
        });

        // Stajyer Satın Alma
        buyInternBtn.addEventListener('click', () => {
            if (money >= intern.cost) {
                money -= intern.cost;
                intern.count++;
                intern.cost = Math.floor(intern.cost * 1.15); // Her alışta fiyat artar
                updateUI();
            }
        });

        // Yazılımcı Satın Alma
        buyDevBtn.addEventListener('click', () => {
            if (money >= dev.cost) {
                money -= dev.cost;
                dev.count++;
                dev.cost = Math.floor(dev.cost * 1.15);
                updateUI();
            }
        });

        // Arayüzü Güncelleme Fonksiyonu
        function updateUI() {
            moneyDisplay.innerText = `$${Math.floor(money)}`;
            internCountDisplay.innerText = `Stajyer: ${intern.count}`;
            internCostDisplay.innerText = intern.cost;
            devCountDisplay.innerText = `Yazılımcı: ${dev.count}`;
            devCostDisplay.innerText = dev.cost;
        }

        // Saniyede Bir Gelen Gelir Döngüsü (Passive Income Loop)
        setInterval(() => {
            let totalPassiveIncome = (intern.count * intern.income) + (dev.count * dev.income);
            money += totalPassiveIncome;
            updateUI();
        }, 1000);
    </script>
</body>
</html>
